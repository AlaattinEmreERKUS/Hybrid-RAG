services:
  neo4j:
    image: neo4j:5
    container_name: hybridrag-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/hybridrag123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  chroma:
    image: chromadb/chroma:latest
    container_name: hybridrag-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  neo4j_data:
  chroma_data:
